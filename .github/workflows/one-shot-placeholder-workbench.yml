name: One-shot placeholder workbench enhancement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: apply placeholder workbench enhancement' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply reviewed changes
        run: python .github/placeholder_workbench_apply.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check mailmerge_app/static/app.js
          python -m pip install -r requirements-dev.txt
          python -m pip check
          python -m compileall -q mailmerge_app
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mailmerge_app/static/index.html mailmerge_app/static/app.js mailmerge_app/static/app.css tests/test_frontend_integrity.py
          git commit -m 'feat: add guided placeholder personalization workbench'
          git push origin HEAD:main
