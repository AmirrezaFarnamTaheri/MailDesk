name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build-windows:
    name: Build final Windows executable
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      MAILMERGE_SIGN_CERT_BASE64: ${{ secrets.MAILMERGE_SIGN_CERT_BASE64 }}
      MAILMERGE_SIGN_CERT_PASSWORD: ${{ secrets.MAILMERGE_SIGN_CERT_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node for frontend syntax validation
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate frontend JavaScript
        shell: pwsh
        run: node --check mailmerge_app/static/app.js

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Prepare optional Authenticode certificate
        if: env.MAILMERGE_SIGN_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'mailmerge-signing.pfx'
          [IO.File]::WriteAllBytes(
            $path,
            [Convert]::FromBase64String($env:MAILMERGE_SIGN_CERT_BASE64)
          )
          "MAILMERGE_SIGN_CERT_PFX=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, test, smoke-test, and package
        shell: pwsh
        run: ./packaging/build-windows.ps1

      - name: Verify final artifacts
        shell: pwsh
        run: |
          $exe = 'dist/MailDesk.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'MailDesk.exe is not a valid PE/MZ executable.'
          }
          Get-Content dist/SHA256SUMS.txt

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: MailDesk-Windows-EXE-${{ github.sha }}
          path: |
            dist/MailDesk.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MailDesk-Windows-Installer-${{ github.sha }}
          path: |
            dist/installer/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30