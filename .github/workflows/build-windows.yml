name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the pyproject.toml version to GitHub Releases after all build checks pass'
        required: false
        default: false
        type: boolean
      repair_existing_release:
        description: 'Explicitly allow moving the existing version tag to this verified build and replacing its assets'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build-windows:
    name: Build final Windows executable
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      MAILMERGE_SIGN_CERT_BASE64: ${{ secrets.MAILMERGE_SIGN_CERT_BASE64 }}
      MAILMERGE_SIGN_CERT_PASSWORD: ${{ secrets.MAILMERGE_SIGN_CERT_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node for frontend syntax validation
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate frontend JavaScript
        shell: pwsh
        run: |
          node --check mailmerge_app/static/app.js

      - name: Install pinned Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress --allow-downgrade

      - name: Prepare optional Authenticode certificate
        if: env.MAILMERGE_SIGN_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'mailmerge-signing.pfx'
          [IO.File]::WriteAllBytes(
            $path,
            [Convert]::FromBase64String($env:MAILMERGE_SIGN_CERT_BASE64)
          )
          "MAILMERGE_SIGN_CERT_PFX=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, test, smoke-test, and package
        shell: pwsh
        run: ./packaging/build-windows.ps1

      - name: Verify final artifacts
        shell: pwsh
        run: |
          $exe = 'dist/MailDesk.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'MailDesk.exe is not a valid PE/MZ executable.'
          }
          Get-Content dist/SHA256SUMS.txt

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: MailDesk-Windows-EXE-${{ github.sha }}
          path: |
            dist/MailDesk.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MailDesk-Windows-Installer-${{ github.sha }}
          path: |
            dist/installer/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_REPAIR: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_existing_release }}
        run: |
          $pyproject = Get-Content -LiteralPath pyproject.toml -Raw
          $match = [regex]::Match($pyproject, '(?m)^version\s*=\s*"([^"]+)"\s*$')
          if (-not $match.Success) { throw 'Could not determine project version from pyproject.toml.' }
          $version = $match.Groups[1].Value
          $expectedTag = "v$version"
          $tag = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF.Substring('refs/tags/'.Length)
          } else {
            $expectedTag
          }
          if ($tag -ne $expectedTag) {
            throw "Release tag $tag does not match pyproject.toml version $version ($expectedTag expected)."
          }

          $installer = "dist/installer/MailDesk-$version-Setup.exe"
          $assets = @('dist/MailDesk.exe', $installer, 'dist/SHA256SUMS.txt')
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
          }

          $repairRelease = $env:MANUAL_REPAIR -eq 'true'
          $tagCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq '.sha' 2>$null
          $tagExists = $LASTEXITCODE -eq 0
          if ($tagExists -and $tagCommit.Trim() -ne $env:GITHUB_SHA) {
            if (-not $repairRelease) {
              throw "Release tag $tag already points to $($tagCommit.Trim()), not this build $env:GITHUB_SHA. Bump the project version, or explicitly choose repair_existing_release for an intentional release repair."
            }
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha=$env:GITHUB_SHA -F force=true *> $null
            if ($LASTEXITCODE -ne 0) { throw "Could not move release tag $tag to verified build $env:GITHUB_SHA." }
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Could not update assets for release $tag." }
            $releaseId = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id'
            if ($LASTEXITCODE -ne 0 -or -not $releaseId) { throw "Could not resolve release metadata for $tag." }
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" -f target_commitish=$env:GITHUB_SHA -f name="MailDesk $version" -f make_latest=true *> $null
            if ($LASTEXITCODE -ne 0) { throw "Could not update release metadata for $tag." }
          } else {
            gh release create $tag @assets `
              --target $env:GITHUB_SHA `
              --title "MailDesk $version" `
              --generate-notes `
              --latest `
              --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag." }
          }
