name: One-shot product simplification cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message == 'chore: remove simplification payload' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove temporary payload
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/simplify-payload/*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove simplification payload files'
          git push origin HEAD:main
