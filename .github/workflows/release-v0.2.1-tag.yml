name: One-shot v0.2.1 release dispatch

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify v0.2.1 tag target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.2.1 --jq '.object.sha')"
          test "$tag_sha" = '2dc329bb099814d419712e8d6e7c1d72f5dfa590'

      - name: Dispatch release workflow at v0.2.1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-windows.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref v0.2.1 \
            -f publish_release=true \
            -f repair_existing_release=false
