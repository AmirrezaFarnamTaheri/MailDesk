name: One-shot v0.2.1 release tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-release-candidate:
    if: github.event.head_commit.message == 'release: trigger v0.2.1 tag'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 2dc329bb099814d419712e8d6e7c1d72f5dfa590
      RELEASE_TAG: v0.2.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify and push release tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          git cat-file -e "$TARGET_SHA^{commit}"
          version="$(git show "$TARGET_SHA:pyproject.toml" | sed -n 's/^version = "\([^"]*\)"$/\1/p' | head -n1)"
          test "$version" = "0.2.1"
          git tag "$RELEASE_TAG" "$TARGET_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
