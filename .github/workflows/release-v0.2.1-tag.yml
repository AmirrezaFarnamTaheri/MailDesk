name: One-shot v0.2.1 release tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release candidate
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e '2dc329bb099814d419712e8d6e7c1d72f5dfa590^{commit}'
          git show '2dc329bb099814d419712e8d6e7c1d72f5dfa590:pyproject.toml' | grep -F 'version = "0.2.1"'

      - name: Push v0.2.1 tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.2.1 >/dev/null 2>&1; then
            echo 'Tag v0.2.1 already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          git tag v0.2.1 2dc329bb099814d419712e8d6e7c1d72f5dfa590
          git push origin refs/tags/v0.2.1
