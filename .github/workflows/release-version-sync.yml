name: One-shot release version sync

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-runtime-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync runtime version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mailmerge_app/main.py')
          text = path.read_text(encoding='utf-8')
          old = 'APP_VERSION = "0.2.0"'
          new = 'APP_VERSION = "0.2.1"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one {old!r}, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit synchronized version
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mailmerge_app/main.py
          git diff --cached --check
          git commit -m 'release: sync runtime version to 0.2.1'
          git push origin HEAD:main
