name: One-shot product clarity pass

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-product-clarity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gate one-shot execution
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" = "chore: run product clarity pass" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "One-shot patch is not requested by this commit."
          fi

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.should_run == 'true'
        with:
          node-version: '22'

      - name: Verify and apply reviewed product clarity patch
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/product-clarity.patch.gz.b64
          actual_bytes="$(wc -c < "$payload" | tr -d ' ')"
          actual_payload_hash="$(sha256sum "$payload" | awk '{print $1}')"
          echo "payload bytes: $actual_bytes"
          echo "payload sha256: $actual_payload_hash"
          test "$actual_bytes" = "16844"
          test "$actual_payload_hash" = "56c563456bfbb90fea60e6ff10fa82e2427ae06028a5846a3021e0f872be3412"
          base64 -d "$payload" > /tmp/product-clarity.patch.gz
          gzip -t /tmp/product-clarity.patch.gz
          gzip -dc /tmp/product-clarity.patch.gz > /tmp/product-clarity.patch
          actual_patch_hash="$(sha256sum /tmp/product-clarity.patch | awk '{print $1}')"
          echo "patch sha256: $actual_patch_hash"
          test "$actual_patch_hash" = "ce43da29ffc38e68f9bcc62cb78f0397b1bc74551b1615e8f34a7ec1d8143ee9"
          git apply --check /tmp/product-clarity.patch
          git apply /tmp/product-clarity.patch

      - name: Validate frontend and test suite
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pip check
          node --check mailmerge_app/static/app.js
          node --check mailmerge_app/static/safety.js
          python -m compileall -q mailmerge_app
          python -m unittest discover -s tests -v

      - name: Commit product clarity improvements
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mailmerge_app/static/index.html mailmerge_app/static/app.js mailmerge_app/static/app.css tests/test_frontend_integrity.py
          git diff --cached --check
          git commit -m 'feat: simplify campaign workflow and product clarity'
          git push origin HEAD:main
