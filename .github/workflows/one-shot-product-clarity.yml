name: One-shot product clarity pass

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-product-clarity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Apply reviewed product clarity patch
        shell: bash
        env:
          PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/product-clarity.patch
          git apply --check /tmp/product-clarity.patch
          git apply /tmp/product-clarity.patch

      - name: Validate frontend and test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pip check
          node --check mailmerge_app/static/app.js
          node --check mailmerge_app/static/safety.js
          python -m compileall -q mailmerge_app
          python -m unittest discover -s tests -v

      - name: Commit product clarity improvements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mailmerge_app/static/index.html mailmerge_app/static/app.js mailmerge_app/static/app.css tests/test_frontend_integrity.py
          git diff --cached --check
          git commit -m 'feat: simplify campaign workflow and product clarity'
          git push origin HEAD:main
