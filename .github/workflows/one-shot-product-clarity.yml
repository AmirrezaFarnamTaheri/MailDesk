name: One-shot product clarity cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: run product clarity cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remove one-shot transport files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .github/product-clarity-chunks
          git rm .github/product-clarity.patch.gz.b64
          git rm .github/product-clarity.trigger
          git commit -m 'chore: remove product clarity transport files'
          git push origin HEAD:main
