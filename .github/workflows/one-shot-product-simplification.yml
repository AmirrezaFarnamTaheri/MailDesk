name: One-shot product simplification

on:
  push:
    branches:
      - automation/product-simplification

permissions:
  contents: write

jobs:
  simplify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: automation/product-simplification

      - name: Verify and sync current main workflow files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "0d3983384b807102f3b3e18b9f74a1a082c09f63"
          git checkout origin/main -- .github/workflows/ci.yml .github/workflows/build-windows.yml

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Apply reviewed simplification
        shell: bash
        run: |
          set -euo pipefail
          python .github/product-simplification/workflows.py
          python .github/product-simplification/backend.py
          python .github/product-simplification/frontend.py
          git rm mailmerge_app/static/safety.js
          git rm .github/product-simplification/backend.py
          git rm .github/product-simplification/frontend.py
          git rm .github/product-simplification/workflows.py
          git rm .github/workflows/one-shot-product-simplification.yml

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate product
        shell: bash
        run: |
          set -euo pipefail
          python -m pip check
          python -m compileall -q mailmerge_app
          node --check mailmerge_app/static/app.js
          python -m unittest discover -s tests -v
          test ! -e mailmerge_app/static/safety.js
          ! grep -R "reviewedCheck\|confirmText\|campaignReadiness\|refreshBeforeReview\|BROWSER_VERIFICATION_MINUTES" mailmerge_app tests docs README.md
          ! grep -R "static/safety.js" .github mailmerge_app tests docs README.md
          git diff --check

      - name: Commit one clean product change
        shell: bash
        run: |
          set -euo pipefail
          git reset --soft 0d3983384b807102f3b3e18b9f74a1a082c09f63
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: simplify workflow and add first-run tour"
          git push origin HEAD:main
