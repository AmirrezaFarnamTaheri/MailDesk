name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q mailmerge_app
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate frontend JavaScript
        run: node --check mailmerge_app/static/app.js
      - name: Validate PowerShell launch/build scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -LiteralPath run.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content -LiteralPath packaging/build-windows.ps1 -Raw))

  visual-review:
    name: Visual review E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      MAILDESK_DATA_DIR: ${{ runner.temp }}/maildesk-visual-review
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install application and browser test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Exercise the full product visual-review journey
        shell: bash
        run: |
          python -m uvicorn mailmerge_app.main:app --host 127.0.0.1 --port 8765 > "$RUNNER_TEMP/maildesk-visual-review.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/visual_review_e2e.py --output artifacts/visual-review/accounts.png
      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MailDesk-Visual-Review-${{ github.sha }}
          path: |
            artifacts/visual-review/*.png
            ${{ runner.temp }}/maildesk-visual-review.log
          if-no-files-found: warn
          retention-days: 14
